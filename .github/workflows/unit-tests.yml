# .github/workflows/unit-tests.yml

name: Unit Tests

on:
  workflow_run:
    workflows: [ "Lint Check" ]
    types:
      - completed

jobs:
  unit-tests:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}

      - name: Download dependencies
        run: ./gradlew build --no-daemon

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

  # This job will run if the lint check failed, providing a clear error message
  lint-failed:
    if: ${{ github.event.workflow_run.conclusion != 'success' }}
    name: Lint Check Failed
    runs-on: ubuntu-latest
    steps:
      - name: Fail workflow due to lint check failure
        run: |
          echo "Lint check failed. Skipping unit tests."
          exit 1
